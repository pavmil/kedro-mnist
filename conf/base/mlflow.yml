# Настройки kedro-mlflow. Не указанные ключи берутся из дефолтов плагина.
# Полная схема: https://kedro-mlflow.readthedocs.io

server:
  mlflow_tracking_uri: sqlite:///mlflow.db  # локальная БД рядом с проектом

tracking:
  experiment:
    name: kedro_mnist
  params:
    dict_params:
      flatten: True   # dict-параметры логируются по ключам: model.max_depth и т.д.
      recursive: True
      sep: "."
    long_params_strategy: tag  # длинные параметры пишем тегом, а не роняем запуск

ui:
  port: "5000"
  host: "127.0.0.1"
