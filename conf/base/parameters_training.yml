# Параметры пайплайна обучения.
# Все гиперпараметры — здесь, чтобы запуск настраивался через конфиг.

model:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.3
  subsample: 1.0
  colsample_bytree: 1.0
  tree_method: hist
  random_state: 42         # фиксируем сид -> воспроизводимость
  n_jobs: 1                # однопоточно -> метрики совпадают при перезапуске
