[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "kedro-mnist"
version = "0.1.0"
description = "Kedro + MLflow template on MNIST: data_collection and training pipelines (XGBoost on pixels), fully reproducible."
authors = ["Pavel Milyutin <pavmil0917@gmail.com>"]
readme = "README.md"
packages = [{ include = "kedro_mnist", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
kedro = "~1.6.0"
kedro-datasets = { version = ">=8.0.0", extras = ["pandas", "matplotlib"] }
kedro-mlflow = "~2.0.3"
mlflow = ">=3.0,<4.0"
xgboost = "~2.1"
scikit-learn = "~1.5"
pandas = "~2.2"
numpy = "~1.26"
pyarrow = ">=15.0"
matplotlib = "~3.9"

[tool.poetry.group.dev.dependencies]
pytest = "~7.2"
pytest-cov = ">=3,<7"
pytest-mock = ">=1.7.1,<2.0"
ruff = "~0.12.0"

[tool.poetry.scripts]
kedro-mnist = "kedro_mnist.__main__:main"

[tool.kedro]
package_name = "kedro_mnist"
project_name = "kedro_mnist"
kedro_init_version = "1.6.0"
tools = "['Linting', 'Testing', 'Custom Logging', 'Data Structure']"
example_pipeline = "False"
source_dir = "src"

[tool.pytest.ini_options]
addopts = "--cov-report term-missing --cov src/kedro_mnist -ra"

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["F", "W", "E", "I", "UP", "PL", "T201"]
ignore = ["E501"]
