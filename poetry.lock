[[package]]
name = "kedro-datasets"
version = "9.6.0"
description = "Kedro-Datasets is where you can find all of Kedro's data connectors."
optional = false
python-versions = ">=3.10"
groups = ["main"]
files = [
    {file = "kedro_datasets-9.6.0-py3-none-any.whl", hash = "sha256:c850ba8e13c5b05aba7d027cd7466d8c387ecea85c38d3a246dfa5d9d8b3bf2c"},
    {file = "kedro_datasets-9.6.0.tar.gz", hash = "sha256:f6ae5a4638a4ee66492b28a5ef62f9de8684e95a51bab8d76aaa3a0f80e1594a"},
]

[package.dependencies]
"backports.strenum" = {version = "*", markers = "python_version < \"3.11\""}
deltalake = {version = ">=0.10.0", optional = true, markers = "extra == \"pandas-deltatabledataset\""}
kedro = ">=1.0.0rc1,<2.0.0"
lazy_loader = "*"
lxml = {version = ">=4.6,<5.0", optional = true, markers = "python_version < \"3.13\" and extra == \"pandas-xmldataset\""}
matplotlib = {version = ">=3.0.3,<4.0", optional = true, markers = "extra == \"matplotlib-matplotlibdataset\""}
openpyxl = {version = ">=3.0.6,<4.0", optional = true, markers = "extra == \"pandas-exceldataset\""}
pandas = {version = ">=1.3,<4.0", optional = true, markers = "extra == \"pandas-base\""}
pandas-gbq = {version = ">=0.12.0", optional = true, markers = "extra == \"pandas-gbqtabledataset\" or extra == \"pandas-gbqquerydataset\""}
pyarrow = {version = ">=6.0", optional = true, markers = "extra == \"pandas-parquetdataset\""}
pyodbc = {version = ">=4.0", optional = true, markers = "extra == \"pandas-sqlquerydataset\""}
SQLAlchemy = {version = ">=1.4,<3.0", optional = true, markers = "extra == \"pandas-sqltabledataset\" or extra == \"pandas-sqlquerydataset\""}
tables = {version = ">=3.6", optional = true, markers = "extra == \"pandas-hdfdataset\""}

